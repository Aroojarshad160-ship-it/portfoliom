<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Footer Section</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- MAP SECTION -->
<section class="w-full">
  <img  src="Map.png" alt="Map" class="w-full h-[300px] object-cover">
</section>

<!-- LOGOS SECTION -->
<section class="bg-gray-100 py-16">
  <div class="max-w-7xl mx-auto px-4">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-8 items-center text-center">

      <img src="Frame.png" class="mx-auto opacity-70 hover:opacity-100 transition duration-300 cursor-pointer">

      <img src="Frame (1).png" class="mx-auto opacity-70 hover:opacity-100 transition duration-300 cursor-pointer">

      <img src="Frame (2).png" class="mx-auto opacity-70 hover:opacity-100 transition duration-300 cursor-pointer">

      <img src="Frame (3).png" class="mx-auto opacity-70 hover:opacity-100 transition duration-300 cursor-pointer">

    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="bg-gray-200 py-6 text-center text-gray-600 text-sm">
  © 2021 All Rights Reserved. Ojomedia
</footer>

</body>
</html>
