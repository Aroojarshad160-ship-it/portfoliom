<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sidebar</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body class="bg-gray-100">

<!-- SIDEBAR -->
<div class="h-screen w-20 bg-white shadow-md flex flex-col items-center py-6 gap-6">

  <!-- Logo / Dot -->
  <div class="w-3 h-3 bg-black rounded-full"></div>

  <!-- Home (Active) -->
  <div class="relative group">
    <div class="w-10 h-10 bg-yellow-500 rounded-full flex items-center justify-center text-white">
      <i class="fas fa-house"></i>
    </div>

    <!-- Tooltip -->
    <span
      class="absolute left-12 top-1/2 -translate-y-1/2 bg-black text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100">
      Home
    </span>
  </div>

  <!-- User -->
  <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-600">
    <i class="fas fa-user"></i>
  </div>

  <!-- Resume -->
  <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-600">
    <i class="fas fa-file"></i>
  </div>

  <!-- Portfolio -->
  <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-600">
    <i class="fas fa-briefcase"></i>
  </div>
   <!-- Feather Icon -->
         <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-600">
  <i class="fa-solid fa-feather"></i>
</div>

  <!-- Contact -->
  <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-600">
    <i class="fas fa-envelope"></i>
  </div>

</div>

</body>
</html>
